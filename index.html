  <script>
    (function () {
      var root = document.documentElement;
      var theme = 'light';
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || saved === 'light') theme = saved;
      } catch (e) {}
      root.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a120d' : '#fafcfa');
      if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        root.classList.add('js');
      }
    })();

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root, :root[data-theme="light"] {
      color-scheme: light;
      --bg: #fafcfa;
      --surface: #ffffff;
      --panel: #eef4ef;
      --ink: #0c1a11;
      --muted: #2f4436;
      --line: #c8d6cb;
      --forest: #0f3416;
      --forest-ink: #ffffff;
      --leaf: #2f7a45;
      --amber: #e0a200;
      --amber-ink: #7a5200;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0a120d;
      --surface: #0f1a13;
      --panel: #16251b;
      --ink: #eaf3ec;
      --muted: #b9cbbd;
      --line: #274232;
      --forest: #9fe0b0;
      --forest-ink: #0a120d;
      --leaf: #6fbf88;
      --amber: #f2c14e;
      --amber-ink: #f2c14e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 1.5rem;
      font-size: clamp(1rem, 0.45vw + 0.7rem, 1.625rem);
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Atkinson Hyperlegible', system-ui, -apple-system, sans-serif;
      font-size: 1.0625rem;
      line-height: 1.65;
      overflow-x: hidden;
    }
    body:has(dialog[open]) { overflow: hidden; }

    ::selection { background: var(--amber); color: #0c1a11; }

    h1, h2, h3 {
      font-family: 'Archivo', system-ui, sans-serif;
      color: var(--forest); line-height: 1.1; letter-spacing: -0.015em; text-wrap: balance;
    }
    h1 { font-size: clamp(1.9rem, 5vw, 4.2rem); font-weight: 800; line-height: 1.02; letter-spacing: -0.03em; overflow-wrap: break-word; }
    .nw { white-space: nowrap; }
    h2 { font-size: clamp(1.8rem, 3vw, 2.5rem); font-weight: 800; letter-spacing: -0.025em; }
    h3 { font-size: 1.2rem; font-weight: 700; }
    p { text-wrap: pretty; }
    a { color: inherit; }
    img { max-width: 100%; height: auto; display: block; }
    :focus-visible { outline: 0.1875rem solid var(--amber); outline-offset: 0.25rem; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .skip-link {
      position: absolute; left: 1rem; top: -4rem; z-index: 2000;
      background: var(--forest); color: var(--forest-ink);
      padding: 0.6rem 1rem; font-weight: 700; transition: top 0.2s;
    }
    .skip-link:focus { top: 0.75rem; }

    .link {
      font-weight: 700; color: var(--forest); text-decoration: underline;
      text-decoration-color: var(--amber); text-decoration-thickness: 0.15em; text-underline-offset: 0.25em;
      transition: text-decoration-thickness 0.15s ease;
    }
    .link:hover { text-decoration-thickness: 0.3em; }
    .links { display: flex; flex-wrap: wrap; gap: 0.4rem 1.75rem; margin-top: 1.25rem; }

    .status { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 0.9rem; color: var(--amber-ink); }
    .status::before { content: ''; width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--amber); flex-shrink: 0; }

    .layout { display: flex; gap: 3.5rem; max-width: 76rem; margin: 0 auto; padding: 1.5rem 1.5rem 0; }
    main { order: 1; flex: 1; min-width: 0; }

    .side {
      order: 2; flex: 0 0 17rem; width: 17rem;
      position: sticky; top: 1.5rem; align-self: flex-start;
      background: var(--surface); border: 1px solid var(--line); border-radius: 0.375rem; overflow: hidden;
      z-index: 100;
    }
    .side-title { font-family: 'Archivo', system-ui, sans-serif; font-weight: 700; font-size: 0.95rem; color: var(--forest); }

    .side-contact { padding: 1.1rem 1.1rem 0.9rem; background: var(--panel); border-bottom: 1px solid var(--line); }
    .side-contact .side-title { margin-bottom: 0.4rem; }
    .side-contact a {
      display: flex; align-items: center; gap: 0.7rem; padding: 0.35rem 0;
      font-size: 0.95rem; font-weight: 700; text-decoration: none; overflow-wrap: anywhere;
    }
    .side-contact a:hover span { text-decoration: underline; text-decoration-color: var(--amber); text-decoration-thickness: 2px; text-underline-offset: 0.2em; }
    .side-contact svg { width: 1.1rem; height: 1.1rem; flex-shrink: 0; color: var(--leaf); }

    .side-nav { padding: 0.9rem 0.6rem 0.7rem; }
    .side-nav-head { display: flex; align-items: center; justify-space-between; padding: 0 0.5rem 0.5rem; }
    .side-nav ul { list-style: none; display: flex; flex-direction: column; gap: 0.1rem; }
    .side-nav a {
      position: relative; display: block; padding: 0.5rem 0.8rem; border-radius: 0.25rem;
      font-weight: 700; text-decoration: none; color: var(--muted);
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .side-nav a::before {
      content: ''; position: absolute; left: 0; top: 0.4rem; bottom: 0.4rem; width: 0.25rem;
      background: var(--amber); transform: scaleY(0); transition: transform 0.25s ease;
    }
    .side-nav a:hover { background: var(--panel); color: var(--ink); }
    .side-nav a.active { background: var(--panel); color: var(--forest); }
    .side-nav a.active::before { transform: scaleY(1); }

    .theme-toggle {
      width: 2.25rem; height: 2.25rem; display: grid; place-items: center; flex-shrink: 0;
      background: transparent; color: var(--ink); cursor: pointer;
      border: 1px solid var(--line); border-radius: 0.25rem;
    }
    .theme-toggle:hover { background: var(--panel); border-color: var(--leaf); }
    .theme-toggle svg { width: 1.15rem; height: 1.15rem; }

    section { padding-top: 5.5rem; }
    .sec-intro { margin-top: 0.75rem; max-width: 58ch; color: var(--muted); }
    .sec-head { margin-bottom: 2.25rem; }

    .hero { padding-top: 0.75rem; }
    .hero > * { animation: fade 0.7s ease backwards; }
    .hero > *:nth-child(2) { animation-delay: 0.1s; }
    .hero > *:nth-child(3) { animation-delay: 0.2s; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .hero-grid { display: grid; grid-template-columns: 1fr auto; gap: 3rem; align-items: start; }
    .hero .lead { margin-top: 1.5rem; max-width: 56ch; font-size: 1.2rem; }
    .photo { width: 11.5rem; border: 1px solid var(--line); border-bottom: 0.5rem solid var(--amber); background: var(--panel); }
    .photo img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 20%; }

    .graph { display: grid; grid-template-columns: auto minmax(2rem, 1fr) auto minmax(2rem, 1fr) auto; align-items: center; margin-top: 3rem; }
    .node {
      display: block; max-width: 14.5rem; padding: 0.8rem 1rem; text-decoration: none; color: var(--ink);
      background: var(--surface); border: 1px solid var(--forest); border-radius: 0.25rem;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .node b { display: block; font-family: 'Archivo', system-ui, sans-serif; font-weight: 700; line-height: 1.2; }
    .node small { display: block; margin-top: 0.15rem; font-size: 0.85rem; line-height: 1.3; color: var(--muted); }
    .node:hover { background: var(--forest); color: var(--forest-ink); }
    .node:hover small { color: inherit; }
    .me {
      width: 3.6rem; height: 3.6rem; border-radius: 50%; background: var(--forest); color: var(--forest-ink);
      display: grid; place-items: center; font-family: 'Archivo', system-ui, sans-serif; font-weight: 800; font-size: 0.95rem;
    }
    .edge { position: relative; display: block; height: 4.5rem; text-decoration: none; color: var(--muted); }
    .edge::after {
      content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px;
      background: var(--leaf); transform-origin: left; animation: draw 0.9s 0.5s ease-out backwards;
    }
    .graph .edge:nth-of-type(2)::after { animation-delay: 1s; }
    .edge span { position: absolute; left: 0.5rem; right: 0.5rem; bottom: calc(50% + 0.5rem); text-align: center; font-size: 0.88rem; line-height: 1.3; }
    .edge:hover { color: var(--ink); }
    .edge:hover::after { background: var(--amber); }
    @keyframes draw { from { transform: scaleX(0); } to { transform: none; } }

    .facts { margin-top: 2.5rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); gap: 0 1.5rem; border-top: 2px solid var(--forest); }
    .facts div { padding: 0.9rem 0; border-bottom: 1px solid var(--line); }
    .facts dt { font-size: 0.88rem; color: var(--muted); }
    .facts dd { font-weight: 700; }

    .timeline { --from: 1.5rem; }
    .lanes { display: grid; grid-template-columns: 1fr 3rem 1fr; margin-bottom: 1rem; font-family: 'Archivo', system-ui, sans-serif; font-weight: 700; }
    .lane { display: flex; align-items: center; gap: 0.6rem; }
    .lane::before { content: ''; width: 0.9rem; height: 0.9rem; background: var(--lane); }
    .lane-form { --lane: var(--leaf); color: var(--leaf); }
    .lane-exp { --lane: var(--amber); color: var(--amber-ink); grid-column: 3; }

    .t-wrap { position: relative; }
    .spine {
      position: absolute; left: 50%; top: 1.7rem; bottom: 0; width: 2px; margin-left: -1px; background: var(--line);
      -webkit-mask-image: linear-gradient(#000 88%, transparent); mask-image: linear-gradient(#000 88%, transparent);
    }
    .spine::after { content: ''; position: absolute; left: 0; top: 0; width: 100%; height: calc(var(--p, 1) * 100%); background: var(--leaf); }
    .t-list { list-style: none; display: grid; gap: 1.5rem; position: relative; }
    .t-item + .t-item { margin-top: -5rem; }
    .t-item { --lane: var(--leaf); display: grid; grid-template-columns: 1fr 3rem 1fr; }
    .t-item[hidden] { display: none; }
    .t-item.exp { --lane: var(--amber); }

    .t-node {
      grid-column: 2; grid-row: 1; justify-self: center; align-self: start; margin-top: 1.15rem;
      position: relative; z-index: 1; width: 1.1rem; height: 1.1rem; border-radius: 50%;
      background: var(--bg); border: 3px solid var(--lane); transition: background-color 0.4s ease;
    }
    .t-node::before { content: ''; position: absolute; top: 50%; height: 2px; margin-top: -1px; width: 0.95rem; background: var(--lane); }
    .t-item.form .t-node::before { right: 100%; }
    .t-item.exp .t-node::before { left: 100%; }
    .t-item.reached .t-node { background: var(--lane); }
    .t-item.upcoming .t-node { border-style: dashed; }
    .t-item.upcoming.reached .t-node { background: var(--bg); }

    .t-card {
      grid-row: 1; display: block; text-decoration: none; color: inherit;
      background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--lane);
      padding: 1rem 1.15rem 1.1rem; transition: border-color 0.2s ease, background-color 0.2s ease, opacity 0.6s ease, transform 0.6s cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    .t-item.form .t-card { grid-column: 1; --from: -1.5rem; }
    .t-item.exp .t-card { grid-column: 3; --from: 1.5rem; }
    .t-card:hover { border-color: var(--lane); background: var(--panel); }
    .t-top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 0.35rem; font-weight: 700; font-size: 0.9rem; }
    .t-item.form .t-type { color: var(--leaf); }
    .t-item.exp .t-type { color: var(--amber-ink); }
    .t-date { display: block; font-weight: 700; font-size: 0.95rem; }
    .t-card h3 { margin-top: 0.4rem; font-size: 1.15rem; }
    .t-where { display: block; margin-top: 0.15rem; color: var(--muted); font-size: 0.95rem; }
    .t-desc { display: block; margin-top: 0.6rem; color: var(--muted); font-size: 0.97rem; line-height: 1.55; }
    .t-more { display: inline-block; margin-top: 0.8rem; font-weight: 700; color: var(--forest); text-decoration: underline; text-decoration-color: var(--amber); text-decoration-thickness: 0.15em; text-underline-offset: 0.25em; transition: text-decoration-thickness 0.15s ease; }
    .t-card:hover .t-more, .row:hover .t-more, .skill:hover .t-more { text-decoration-thickness: 0.3em; }

    .js .t-item .t-card { opacity: 0; transform: translateX(var(--from)); }
    .js .t-item.shown .t-card { opacity: 1; transform: none; }

    .logo-tile {
      display: grid; place-items: center; padding: 1.25rem; background: #ffffff;
      border: 1px solid var(--line); border-radius: 0.25rem; text-decoration: none;
      transition: border-color 0.2s ease;
    }
    a.logo-tile:hover { border-color: var(--forest); }
    .logo-tile img { object-fit: contain; }
    .logo-tile.big img { width: min(100%, 13rem); height: auto; }
    .logo-tile.wide img { width: 100%; height: auto; max-height: 6rem; }
    .logo-tile.small { height: 9.5rem; }
    .logo-tile.small img { height: 6.5rem; width: auto; max-width: 100%; }

    .split { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 2rem 3rem; align-items: start; }
    .split p { max-width: 60ch; color: var(--muted); }
    .split p + p { margin-top: 0.9rem; }
    .split .links p { max-width: none; }

    .academies-title { margin: 3rem 0 1rem; font-size: 1.1rem; }
    .academies { display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); gap: 1.25rem; }
    .academies .mine { border-bottom: 0.4rem solid var(--amber); }
    .caption { margin-top: 0.5rem; font-size: 0.92rem; color: var(--muted); }
    .caption b { color: var(--ink); }

    .facts.mini { margin-top: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); }

    .rows { margin-inline: -1rem; border-bottom: 1px solid var(--line); }
    .row {
      display: grid; grid-template-columns: 1fr 15rem; gap: 0.75rem 2rem; align-items: start;
      padding: 1.75rem 1rem; border-top: 1px solid var(--line);
      text-decoration: none; color: inherit; transition: background-color 0.2s ease;
    }
    .row:hover { background: var(--panel); }
    .row h3 { font-size: 1.6rem; margin-bottom: 0.4rem; }
    .row p { margin-top: 0.6rem; color: var(--muted); max-width: 56ch; }
    .tools { display: block; color: var(--ink); font-size: 0.95rem; }
    .tools::before { content: 'Outils'; display: block; font-weight: 700; color: var(--muted); font-size: 0.85rem; margin-bottom: 0.15rem; }

    .skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 2rem; }
    .skill {
      display: block; text-decoration: none; color: inherit; padding: 1.1rem 1rem 1.25rem;
      border-top: 5px solid var(--forest); transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .skill:hover { background: var(--panel); border-top-color: var(--amber); }
    .skill h3 { margin-bottom: 0.4rem; }
    .skill .status { margin-bottom: 0.6rem; }
    .skill p { color: var(--muted); }
    .skill ul { margin-top: 0.8rem; list-style: none; display: grid; gap: 0.2rem; font-size: 0.95rem; }
    .skill ul li::before { content: ''; display: inline-block; width: 0.5rem; height: 2px; background: var(--leaf); margin-right: 0.6rem; vertical-align: middle; }

    .btn {
      display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.75rem 1.2rem; font: inherit; font-weight: 700; line-height: 1.4;
      text-decoration: none; cursor: pointer; color: var(--ink); background: transparent;
      border: 2px solid var(--forest); border-radius: 0.25rem; transition: background-color 0.2s ease, color 0.2s ease;
    }
    .btn:hover { background: var(--panel); }
    .btn.solid { background: var(--forest); color: var(--forest-ink); }
    .btn.solid:hover { background: var(--leaf); border-color: var(--leaf); color: #ffffff; }
    .btn svg { width: 1.1rem; height: 1.1rem; flex-shrink: 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }

    .contact-mail {
      display: inline-block; margin-top: 1.5rem; font-family: 'Archivo', system-ui, sans-serif; font-weight: 800;
      font-size: clamp(1.4rem, 3.4vw, 2.5rem); letter-spacing: -0.02em; line-height: 1.25; color: var(--forest); overflow-wrap: anywhere;
      text-decoration: underline; text-decoration-color: var(--amber); text-decoration-thickness: 0.15em; text-underline-offset: 0.2em;
    }
    .contact-mail:hover { text-decoration-thickness: 0.3em; }
    .contact .actions { margin-top: 1.75rem; }

    footer { margin-top: 6rem; border-top: 2px solid var(--forest); padding: 1.25rem 0 2.5rem; font-size: 0.92rem; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.75rem 1.5rem; }
    .link-btn { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline; font-weight: 700; cursor: pointer; }
    .link-btn:hover { color: var(--ink); }

    .detail { display: none; max-width: 46rem; padding-top: 0.5rem; }
    .detail:target { display: block; animation: fade 0.35s ease; }
    main:has(.detail:target) .home { display: none; }

    .back { display: inline-flex; align-items: center; gap: 0.4rem; margin-bottom: 2rem; font-weight: 700; color: var(--forest); text-decoration: none; }
    .back svg { width: 1.1rem; height: 1.1rem; }
    .back:hover { text-decoration: underline; text-decoration-color: var(--amber); text-decoration-thickness: 2px; text-underline-offset: 0.25em; }
    .detail h2 { margin-bottom: 0.5rem; }
    .detail .status { margin-top: 0.5rem; }
    .meta { margin: 1.75rem 0 0.5rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 0 1.5rem; border-top: 2px solid var(--forest); }
    .meta div { padding: 0.8rem 0; border-bottom: 1px solid var(--line); }
    .meta dt { font-size: 0.88rem; color: var(--muted); }
    .meta dd { font-weight: 700; }
    .prose h3 { margin: 2.25rem 0 0.6rem; font-size: 1.3rem; }
    .prose p { max-width: 62ch; color: var(--muted); }
    .prose p + p { margin-top: 0.9rem; }
    .prose ul { margin: 0.7rem 0 0 1.1rem; max-width: 62ch; display: grid; gap: 0.4rem; color: var(--muted); }
    .prose ul li::marker { color: var(--leaf); }
    .prose strong { color: var(--ink); }
    .chips { margin-top: 0.8rem; display: flex; flex-wrap: wrap; gap: 0.5rem; list-style: none; }
    .chips li { padding: 0.25rem 0.75rem; border: 1px solid var(--line); border-radius: 0.25rem; font-weight: 700; font-size: 0.92rem; background: var(--surface); }
    .defs { margin-top: 1.25rem; border-top: 2px solid var(--forest); }
    .defs div { display: grid; grid-template-columns: minmax(9rem, 13rem) 1fr; gap: 0.25rem 1.75rem; padding: 1rem 0; border-bottom: 1px solid var(--line); }
    .defs dt { font-family: 'Archivo', system-ui, sans-serif; font-weight: 700; color: var(--forest); }
    .defs dd { color: var(--muted); }
    .see-also { margin-top: 3.25rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
    .see-also h3 { font-size: 1.05rem; margin-bottom: 0.6rem; }
    .see-also ul { list-style: none; display: flex; flex-wrap: wrap; gap: 0.4rem 1.75rem; }

    dialog.modal {
      margin: auto; padding: 0; width: min(40rem, 92%); max-height: 85vh; overflow-y: auto;
      background: var(--surface); color: var(--ink); border: 2px solid var(--forest); border-radius: 0.375rem;
    }
